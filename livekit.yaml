# =============================================
# LiveKit server configuration
# =============================================
port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  # Automatically detect and use external IP for WebRTC
  use_external_ip: true

# API key/secret pairs — must match lk-jwt-service in docker-compose.yml
keys:
  YOUR_LIVEKIT_API_KEY: YOUR_LIVEKIT_API_SECRET

logging:
  level: info
